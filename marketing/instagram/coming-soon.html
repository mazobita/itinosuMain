<!doctype html>
<!-- Instagram post, "Itinosu is coming soon" (1080×1350, 4:5 feed). Source for coming-soon-{light,dark}.png.
     Marketing only: this folder is never built or deployed. Tokens match the app's Figma variables
     (Itinosu Colour / Itinosu Layout, see src/styles/tokens.css); the screen is the Figma export at 1:1.
     Render: open with ?theme=light or ?theme=dark at 1080×1350, device scale 1 (see README.md). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --canvas: #fbf7ee; --canvas-line: #e6ddc8; --tint: #0b6b70; --on-tint: #ffffff;
    --label: #000000; --secondary: #56524c; --bezel: #1c1c1f;
    --s8: 8px; --s16: 16px; --s24: 24px; --s32: 32px; --s48: 48px;
    --radius-full: 999px;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
  }
  :root.dark {
    --canvas: #14110c; --canvas-line: #2e281e; --tint: #5cc8c4; --on-tint: #0b2b2c;
    --label: #ffffff; --secondary: #b4afa6;
  }
  html, body { margin: 0; }
  body {
    width: 1080px; height: 1350px; overflow: hidden; position: relative;
    background: var(--canvas); color: var(--label); font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  /* A soft tint glow behind the phone, from the landing hero */
  .glow {
    position: absolute; left: 50%; top: 700px; width: 900px; height: 900px; transform: translateX(-50%);
    border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--tint) 16%, transparent), transparent);
  }
  .top { position: absolute; inset: 96px 96px auto; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .brand { display: flex; align-items: center; gap: var(--s16); }
  .icon { width: 88px; height: 88px; border-radius: 19.8px; overflow: hidden; background: #fbf7ee; box-shadow: 0 0 0 1.5px var(--canvas-line); }
  .icon svg { display: block; width: 100%; height: 100%; }
  .name { font-size: 48px; font-weight: 700; letter-spacing: -0.6px; }
  .eyebrow { margin-top: var(--s48); font-size: 24px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; color: var(--tint); }
  h1 { margin: var(--s16) 0 0; font-size: 72px; line-height: 1.08; font-weight: 700; letter-spacing: -1.4px; }
  .lead { margin: var(--s24) 0 0; font-size: 32px; line-height: 1.3; color: var(--secondary); max-width: 820px; }
  .soon {
    margin-top: var(--s32); display: inline-flex; align-items: center; gap: var(--s8);
    padding: var(--s16) var(--s32); border-radius: var(--radius-full);
    background: var(--tint); color: var(--on-tint); font-size: 28px; font-weight: 600; letter-spacing: -0.2px;
  }
  .soon svg { width: 30px; height: 30px; }
  /* iPhone 402 pt screen at 1:1, rising from the bottom edge */
  .phone {
    position: absolute; left: 50%; top: 728px; transform: translateX(-50%);
    padding: 14px; border-radius: 70px; background: var(--bezel);
    box-shadow: 0 0 0 2px #3a3a3e inset, 0 40px 80px rgba(40, 30, 10, 0.22);
  }
  .phone img { display: block; width: 402px; height: 874px; border-radius: 56px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="top">
    <div class="brand">
      <div class="icon"><svg preserveAspectRatio="none" overflow="visible"  width="100%" height="100%" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="Foreground / Itinosu mark (i + paper plane)"><path id="Stem" d="M7.19651 12.625C7.63401 12.375 10.134 12.125 12.4465 12.125C13.5715 12.125 14.259 12.8125 14.259 13.9375V21.5625C14.259 23.125 14.759 24.3125 15.884 25.125C16.1965 25.3438 16.0403 25.6875 15.5715 25.6875H10.4465C9.69651 25.6875 9.19651 25.1875 9.19651 24.4375V14.6875C9.19651 14.0625 8.82151 13.6875 8.19651 13.5625L7.50901 13.4375C6.88401 13.3438 6.75901 12.8125 7.19651 12.625Z" fill="black"/><circle id="Dot" cx="11.3125" cy="8.4375" r="2.9375" fill="#0B6B70"/><path id="Plane / Fold (silhouette)" d="M15.3975 14.577C15.1494 14.4628 15.1742 14.1025 15.4355 14.0232L26.4835 10.6741C26.7166 10.6034 26.931 10.8281 26.8494 11.0576L22.9827 21.9332C22.8912 22.1905 22.5302 22.1982 22.4278 21.9452L20.4168 16.9775C20.3884 16.9074 20.3344 16.8508 20.2658 16.8192L15.3975 14.577Z" fill="#08555A"/><path id="Plane / Face" d="M26.484 10.6745C26.6562 10.6225 26.8162 10.7314 26.8561 10.8845L20.3727 16.8688L20.3092 16.8444C20.2955 16.8351 20.2815 16.8261 20.2662 16.819L15.3971 14.5769C15.1495 14.4625 15.1742 14.1025 15.4352 14.0231L26.484 10.6745Z" fill="#0B6B70"/></g></svg></div>
      <div class="name">Itinosu</div>
    </div>
    <div class="eyebrow">Your travel organiser</div>
    <h1>Every booking, ticket and plan, in one tidy trip.</h1>
    <p class="lead">Flights, stays, visas and costs together, ready when you need them. For iPhone, iPad and Mac.</p>
    <div class="soon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      Coming soon to the App Store
    </div>
  </div>
  <div class="phone"><img id="screen" src="../../public/img/iphone-light.png" alt="" /></div>
  <script>
    if (new URLSearchParams(location.search).get('theme') === 'dark') {
      document.documentElement.classList.add('dark')
      document.getElementById('screen').src = '../../public/img/iphone-dark.png'
    }
  </script>
</body>
</html>
